name: Build ImmortalWrt for BPI R4

on:
  workflow_dispatch:
  push:
    branches:
      - mt798x-mt799x-6.6-mtwifi
      - medyma-6.6-mtwifi

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /usr/share/swift /opt/ghc /usr/local/share/boost
          sudo docker image prune --all --force
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext libncurses-dev libssl-dev python3-setuptools \
            rsync swig unzip zlib1g-dev file wget libelf-dev ccache git

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          [ -f ./scripts/mt7988-apply-feed-patches.sh ] && ./scripts/mt7988-apply-feed-patches.sh || true

      - name: Load BPI R4 custom config
        run: |
          cp defconfig/bpi-r4_custom.config .config
          make defconfig

      - name: Download dependencies
        run: |
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm {} \;
        timeout-minutes: 120

      - name: Compile firmware
        run: |
          make -j$(nproc) || make -j1 V=s
        timeout-minutes: 480
        env:
          CONFIG_CCACHE_DIR: ~/.ccache

      - name: Prepare firmware artifacts
        if: success()
        run: |
          mkdir -p /tmp/firmware
          find bin/targets/mediatek/filogic_a73/ -maxdepth 1 -type f -exec cp -f {} /tmp/firmware/ \;
          echo "FIRMWARE_DIR=/tmp/firmware" >> $GITHUB_ENV

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BPI-R4-firmware
          path: ${{ env.FIRMWARE_DIR }}/
          retention-days: 30

      - name: Create release on success
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.FIRMWARE_DIR }}/*
          tag_name: bpi-r4-${{ github.run_number }}
          name: ImmortalWrt BPI-R4 Build ${{ github.run_number }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
