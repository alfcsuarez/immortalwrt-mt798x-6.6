name: Build ImmortalWrt for BPI R4

on:
  push:
    branches:
      - mt798x-mt799x-6.6-mtwifi
  pull_request:
    branches:
      - mt798x-mt799x-6.6-mtwifi
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext libncurses-dev libssl-dev python3-setuptools \
            rsync swig unzip zlib1g-dev file wget libelf-dev ccache git
      
      - name: Copy BPI R4 config
        run: cp defconfig/mt7988_mt7990.config .config
      
      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      
      - name: Download dependencies
        run: |
          make download -j8
          find dl -size -1024c -exec ls -l {} \;
          find dl -size -1024c -exec rm {} \;
        timeout-minutes: 120

      - name: Compile firmware
        run: |
          make -j$(nproc) world V=s
        timeout-minutes: 480
        env:
          CONFIG_CCACHE_DIR: ~/.ccache
      
      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: bin/
          retention-days: 30
      
      - name: Create release on success
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          files: bin/targets/**/immortalwrt-*.bin
          tag_name: build-${{ github.run_number }}-${{ github.sha }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
